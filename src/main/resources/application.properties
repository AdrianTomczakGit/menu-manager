# Name displayed for the application
spring.application.name=menu-manager

# A file-based H2 database keeps menu items after the application restarts.
spring.datasource.url=jdbc:h2:file:./data/menu-manager
spring.datasource.username=sa
spring.datasource.password=

# Update the local schema when the entity changes without deleting stored data.
spring.jpa.hibernate.ddl-auto=update

# Database work is completed in the service layer rather than in the web view.
spring.jpa.open-in-view=false

# The H2 console is useful for inspecting the local portfolio database.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
