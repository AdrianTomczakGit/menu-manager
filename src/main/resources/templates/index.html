<!DOCTYPE html>

<!-- Enables Thymeleaf attributes such as th:text and th:field. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Defines the character encoding used by the page. -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones and smaller screens. -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Text displayed in the browser tab. -->
    <title>Menu Manager</title>

    <!-- Loads the stylesheet from the static/css folder. -->
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">
</head>

<body>

    <!-- Main page heading. -->
    <header>
        <h1>Menu Manager</h1>
        <p>Create and manage your menu items.</p>
    </header>

    <!-- Contains the add form and current menu. -->
    <main>

        <!-- Add-menu-item section. -->
        <section>

            <h2>Add a Menu Item</h2>

            <!--
                Connects the form to the MenuItem object.

                When submitted, the form sends a POST request
                to /menu-items.
            -->
            <form
                th:action="@{/menu-items}"
                th:object="${menuItem}"
                method="post">

                <!-- Menu-item name field. -->
                <div>
                    <label for="name">
                        Name:
                    </label>

                    <!-- Connects this input to MenuItem.name. -->
                    <input
                        id="name"
                        type="text"
                        th:field="*{name}"
                        maxlength="100"
                        required>

                    <!-- Displays a validation error for the name. -->
                    <small
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                        Name error
                    </small>
                </div>

                <!-- Menu-item description field. -->
                <div>
                    <label for="description">
                        Description:
                    </label>

                    <!-- Connects this input to MenuItem.description. -->
                    <textarea
                        id="description"
                        th:field="*{description}"
                        maxlength="300"></textarea>

                    <!-- Displays a validation error for the description. -->
                    <small
                        th:if="${#fields.hasErrors('description')}"
                        th:errors="*{description}">
                        Description error
                    </small>
                </div>

                <!-- Menu-item price field. -->
                <div>
                    <label for="price">
                        Price:
                    </label>

                    <!--
                        Connects this input to MenuItem.price.

                        The minimum value is £0.01 and prices
                        can use two decimal places.
                    -->
                    <input
                        id="price"
                        type="number"
                        th:field="*{price}"
                        min="0.01"
                        step="0.01"
                        required>

                    <!-- Displays a validation error for the price. -->
                    <small
                        th:if="${#fields.hasErrors('price')}"
                        th:errors="*{price}">
                        Price error
                    </small>
                </div>

                <!-- Menu-item category field. -->
                <div>
                    <label for="category">
                        Category:
                    </label>

                    <!-- Connects this input to MenuItem.category. -->
                    <input
                        id="category"
                        type="text"
                        th:field="*{category}"
                        maxlength="50"
                        required>

                    <!-- Displays a validation error for the category. -->
                    <small
                        th:if="${#fields.hasErrors('category')}"
                        th:errors="*{category}">
                        Category error
                    </small>
                </div>

                <!-- Menu-item availability field. -->
                <div>
                    <label for="available">
                        Available:
                    </label>

                    <!-- Connects this checkbox to MenuItem.available. -->
                    <input
                        id="available"
                        type="checkbox"
                        th:field="*{available}">
                </div>

                <!-- Submits the completed form. -->
                <button type="submit">
                    Add Item
                </button>

            </form>

        </section>

        <!-- Existing-menu-items section. -->
        <section>

            <h2>Current Menu</h2>

            <!-- Appears when the database contains no items. -->
            <p th:if="${menuItems.isEmpty()}">
                No menu items have been added yet.
            </p>

            <!--
                Repeats this card once for every item
                returned from the database.
            -->
            <article
                class="menu-item"
                th:each="item : ${menuItems}">

                <!-- Displays the item's name. -->
                <h3 th:text="${item.name}">
                    Example Item
                </h3>

                <!--
                    Displays the description only when
                    a description has been provided.
                -->
                <p
                    th:if="${item.description != null and !item.description.isBlank()}"
                    th:text="${item.description}">
                    Example description
                </p>

                <!-- Displays the item's price with two decimal places. -->
                <p>
                    <strong>Price:</strong>

                    £<span
                        th:text="${#numbers.formatDecimal(item.price, 1, 2)}">
                        0.00
                    </span>
                </p>

                <!-- Displays the item's category. -->
                <p>
                    <strong>Category:</strong>

                    <span th:text="${item.category}">
                        Example category
                    </span>
                </p>

                <!-- Displays whether the item is available. -->
                <p>
                    <strong>Available:</strong>

                    <span
                        class="status"
                        th:text="${item.available ? 'Yes' : 'No'}">
                        Yes
                    </span>
                </p>

                <!-- Groups the Edit and Delete controls. -->
                <div class="item-actions">

                    <!-- Opens the edit page for this item. -->
                    <a
                        class="action-link edit-button"
                        th:href="@{/menu-items/{id}/edit(id=${item.id})}">
                        Edit
                    </a>

                    <!-- Sends a POST request to delete this item. -->
                    <form
                        th:action="@{/menu-items/{id}/delete(id=${item.id})}"
                        method="post">

                        <!-- Requests confirmation before deleting. -->
                        <button
                            class="delete-button"
                            type="submit"
                            onclick="return confirm('Are you sure you want to delete this item?')">
                            Delete
                        </button>

                    </form>

                </div>

            </article>

        </section>

    </main>

</body>

</html>
