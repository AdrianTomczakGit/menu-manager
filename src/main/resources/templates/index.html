<!DOCTYPE html>

<!--
    Enables Thymeleaf features such as:
    th:action, th:object, th:field and th:text.
-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Defines the character encoding used by the webpage. -->
    <meta charset="UTF-8">

    <!-- Makes the page display correctly on mobile devices. -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Text displayed in the browser tab. -->
    <title>Menu Manager</title>
</head>

<body>

    <!-- Main heading displayed at the top of the page. -->
    <header>
        <h1>Menu Manager</h1>

        <p>
            Create and manage your menu items.
        </p>
    </header>

    <!-- Contains the main content of the page. -->
    <main>

        <!-- Section containing the add-menu-item form. -->
        <section>

            <h2>Add a Menu Item</h2>

            <!--
                th:action tells the form where to send its data.

                th:object connects the form to the MenuItem object
                supplied by MenuItemController.

                method="post" sends the information using a POST request.
            -->
            <form
                th:action="@{/menu-items}"
                th:object="${menuItem}"
                method="post">

                <!-- Menu-item name field. -->
                <div>

                    <label for="name">
                        Name:
                    </label>

                    <!--
                        th:field connects this input to MenuItem.name.

                        maxlength limits the browser input to 100 characters.

                        required prevents the browser from submitting
                        an empty value.
                    -->
                    <input
                        id="name"
                        type="text"
                        th:field="*{name}"
                        maxlength="100"
                        required>

                    <!--
                        Displays the server-side validation message
                        when the name is invalid.
                    -->
                    <small
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                        Name error
                    </small>

                </div>

                <!-- Menu-item description field. -->
                <div>

                    <label for="description">
                        Description:
                    </label>

                    <!--
                        Connects this textarea to MenuItem.description.

                        The description is optional but is limited
                        to 300 characters.
                    -->
                    <textarea
                        id="description"
                        th:field="*{description}"
                        maxlength="300"></textarea>

                    <!-- Displays the description validation message. -->
                    <small
                        th:if="${#fields.hasErrors('description')}"
                        th:errors="*{description}">
                        Description error
                    </small>

                </div>

                <!-- Menu-item price field. -->
                <div>

                    <label for="price">
                        Price:
                    </label>

                    <!--
                        Connects this input to MenuItem.price.

                        type="number" accepts numerical values.

                        min="0.01" prevents prices below one penny.

                        step="0.01" allows prices such as £4.99.
                    -->
                    <input
                        id="price"
                        type="number"
                        th:field="*{price}"
                        min="0.01"
                        step="0.01"
                        required>

                    <!-- Displays the price validation message. -->
                    <small
                        th:if="${#fields.hasErrors('price')}"
                        th:errors="*{price}">
                        Price error
                    </small>

                </div>

                <!-- Menu-item category field. -->
                <div>

                    <label for="category">
                        Category:
                    </label>

                    <!--
                        Connects this input to MenuItem.category.

                        The category is required and limited
                        to 50 characters.
                    -->
                    <input
                        id="category"
                        type="text"
                        th:field="*{category}"
                        maxlength="50"
                        required>

                    <!-- Displays the category validation message. -->
                    <small
                        th:if="${#fields.hasErrors('category')}"
                        th:errors="*{category}">
                        Category error
                    </small>

                </div>

                <!-- Menu-item availability field. -->
                <div>

                    <label for="available">
                        Available:
                    </label>

                    <!--
                        Connects this checkbox to MenuItem.available.

                        Checked means true.
                        Unchecked means false.
                    -->
                    <input
                        id="available"
                        type="checkbox"
                        th:field="*{available}">

                </div>

                <!-- Submits the form to the controller. -->
                <button type="submit">
                    Add Item
                </button>

            </form>

        </section>

        <!-- Section displaying existing menu items. -->
        <section>

            <h2>Current Menu</h2>

            <!--
                This message is shown only when no menu
                items exist in the database.
            -->
            <p th:if="${menuItems.isEmpty()}">
                No menu items have been added yet.
            </p>

            <!--
                th:each repeats this article once for every
                MenuItem inside the menuItems list.
            -->
            <article th:each="item : ${menuItems}">

                <!-- Displays the menu item's name. -->
                <h3 th:text="${item.name}">
                    Example Item
                </h3>

                <!--
                    Displays the description only when it is
                    not null or blank.
                -->
                <p
                    th:if="${item.description != null and !item.description.isBlank()}"
                    th:text="${item.description}">
                    Example description
                </p>

                <!-- Displays the menu item's formatted price. -->
                <p>
                    <strong>Price:</strong>

                    £<span
                        th:text="${#numbers.formatDecimal(item.price, 1, 2)}">
                        0.00
                    </span>
                </p>

                <!-- Displays the menu item's category. -->
                <p>
                    <strong>Category:</strong>

                    <span th:text="${item.category}">
                        Example category
                    </span>
                </p>

                <!-- Displays Yes or No depending on availability. -->
                <p>
                    <strong>Available:</strong>

                    <span
                        th:text="${item.available ? 'Yes' : 'No'}">
                        Yes
                    </span>
                </p>

                <!--
                    Opens the editing page for this menu item.

                    The item's database ID is placed into the URL.
                -->
                <a
                    th:href="@{/menu-items/{id}/edit(id=${item.id})}">
                    Edit
                </a>

                <!--
                    Sends a POST request to delete the selected item.
                -->
                <form
                    th:action="@{/menu-items/{id}/delete(id=${item.id})}"
                    method="post">

                    <!--
                        Displays a confirmation message before
                        the form is submitted.
                    -->
                    <button
                        type="submit"
                        onclick="return confirm(
                            'Are you sure you want to delete this item?'
                        )">
                        Delete
                    </button>

                </form>

                <!-- Separates one menu item from the next. -->
                <hr>

            </article>

        </section>

    </main>

</body>

</html>
