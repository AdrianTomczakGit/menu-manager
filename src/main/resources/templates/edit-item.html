<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Item | Menu Manager</title>

    <!-- The edit page uses the same Bootstrap theme as the homepage. -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark shadow-sm" aria-label="Main navigation">
        <div class="container py-2">
            <a class="navbar-brand fs-3 fw-bold" th:href="@{/}">Menu Manager</a>
            <span class="navbar-text text-white-50 d-none d-sm-inline">
                Edit menu item
            </span>
        </div>
    </nav>

    <main class="container py-4 py-lg-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-6">
                <section class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white py-3">
                        <h1 class="h4 mb-0">Edit Menu Item</h1>
                    </div>

                    <div class="card-body p-4">
                        <p class="text-body-secondary">
                            Update the item details, then save your changes.
                        </p>

                        <!-- itemId keeps the correct URL when validation returns this page. -->
                        <form
                            th:action="@{/menu-items/{id}/edit(id=${itemId})}"
                            th:object="${menuItem}"
                            method="post">

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Name</label>
                                <input
                                    id="name"
                                    class="form-control"
                                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                    type="text"
                                    th:field="*{name}"
                                    maxlength="100"
                                    required>
                                <div class="invalid-feedback" th:errors="*{name}">
                                    Name error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label fw-semibold">
                                    Description
                                    <span class="text-body-secondary fw-normal">(optional)</span>
                                </label>
                                <textarea
                                    id="description"
                                    class="form-control"
                                    th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                    th:field="*{description}"
                                    maxlength="300"
                                    rows="4"></textarea>
                                <div class="form-text">Maximum 300 characters.</div>
                                <div class="invalid-feedback" th:errors="*{description}">
                                    Description error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label fw-semibold">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">&pound;</span>
                                    <input
                                        id="price"
                                        class="form-control"
                                        th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                        type="number"
                                        th:field="*{price}"
                                        min="0.01"
                                        step="0.01"
                                        required>
                                </div>
                                <div
                                    class="invalid-feedback d-block"
                                    th:if="${#fields.hasErrors('price')}"
                                    th:errors="*{price}">
                                    Price error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label fw-semibold">Category</label>
                                <input
                                    id="category"
                                    class="form-control"
                                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'"
                                    type="text"
                                    th:field="*{category}"
                                    maxlength="50"
                                    required>
                                <div class="invalid-feedback" th:errors="*{category}">
                                    Category error
                                </div>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input
                                    id="available"
                                    class="form-check-input"
                                    type="checkbox"
                                    role="switch"
                                    th:field="*{available}">
                                <label for="available" class="form-check-label">
                                    Item is currently available
                                </label>
                            </div>

                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <button type="submit" class="btn btn-primary flex-grow-1">
                                    Save Changes
                                </button>
                                <a class="btn btn-outline-secondary" th:href="@{/}">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="border-top bg-white py-4">
        <div class="container text-center text-body-secondary">
            <small>Menu Manager &middot; Spring Boot portfolio project</small>
        </div>
    </footer>
</body>

</html>
